name: NetOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m py_compile agent/netops_agent.py

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check demo-data.js

      - name: Validate JSON
        run: |
          python -m json.tool vercel.json > /dev/null
          python -m json.tool agent/agent_config.example.json > /dev/null
